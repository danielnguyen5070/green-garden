<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f3efe6"/>
      <stop offset="55%" stop-color="#e4ecdf"/>
      <stop offset="100%" stop-color="#c9d8c4"/>
    </radialGradient>
    <linearGradient id="pot1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d79263"/>
      <stop offset="100%" stop-color="#b9784f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7a52"/>
      <stop offset="100%" stop-color="#2f5d3a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- soft window light -->
  <ellipse cx="520" cy="180" rx="180" ry="90" fill="#fff8ef" opacity="0.55"/>
  <!-- hanging plant -->
  <path d="M250 90c40 70 20 140-10 180" fill="none" stroke="#2f5d3a" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="220" cy="250" rx="34" ry="58" fill="url(#leaf)" transform="rotate(-28 220 250)"/>
  <ellipse cx="255" cy="270" rx="30" ry="52" fill="#3f6b45" transform="rotate(18 255 270)"/>
  <!-- tall plant left -->
  <rect x="210" y="470" width="90" height="110" rx="10" fill="url(#pot1)"/>
  <path d="M255 470c-8-90-48-150-70-170 42 18 78 78 86 170Z" fill="url(#leaf)"/>
  <path d="M255 470c8-95 55-155 85-170-50 28-78 90-85 170Z" fill="#3f6b45"/>
  <path d="M255 470c0-80 20-145 48-175-8 55-20 110-48 175Z" fill="#254b2e"/>
  <!-- center plant -->
  <rect x="355" y="500" width="110" height="120" rx="12" fill="#c4b7a6"/>
  <ellipse cx="410" cy="390" rx="70" ry="95" fill="url(#leaf)"/>
  <ellipse cx="360" cy="410" rx="48" ry="78" fill="#3f6b45" transform="rotate(-25 360 410)"/>
  <ellipse cx="460" cy="415" rx="48" ry="78" fill="#4f7a52" transform="rotate(28 460 415)"/>
  <ellipse cx="410" cy="340" rx="36" ry="58" fill="#254b2e"/>
  <!-- right plant -->
  <rect x="520" y="455" width="95" height="125" rx="11" fill="url(#pot1)"/>
  <path d="M567 455c-30-110 10-180 55-205-70 45-75 130-55 205Z" fill="url(#leaf)"/>
  <path d="M567 455c35-100 5-175-35-205 55 40 70 120 35 205Z" fill="#3f6b45"/>
  <ellipse cx="600" cy="360" rx="28" ry="70" fill="#4f7a52" transform="rotate(15 600 360)"/>
  <!-- floor shadow -->
  <ellipse cx="410" cy="650" rx="220" ry="28" fill="#243127" opacity="0.08"/>
</svg>